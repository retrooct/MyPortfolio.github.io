<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | {{ site.title }}</title>

    <link rel="stylesheet" href="{{ '/css/index.css' | relative_url }}">

    {% if page.custom_css %}
    <link rel="stylesheet" href="{{ '/css/' | append: page.custom_css | append: '.css' | relative_url }}">
    {% endif %}
</head>

<body>
    <div class="site-wrapper">

        <header class="site-header">
            <div class="top-banner">
                <h1>asample</h1>
                <p>Retro-style personal website</p>
            </div>

            <nav class="simple-nav">
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/projects/' | relative_url }}">Projects</a>
                <a href="{{ '/interests/' | relative_url }}">Interests</a>
                <a href="{{ '/about/' | relative_url }}">About</a>
            </nav>
        </header>

        <div class="page-layout">

            <aside class="left-sidebar">
                <h3>Projects</h3>

                <a href="{{ '/projects/embedded/' | relative_url }}">
                    Embedded
                </a>

                <a href="{{ '/projects/fpga/' | relative_url }}">
                    FPGA
                </a>

                <a href="{{ '/projects/programming/' | relative_url }}">
                    Programming
                </a>
            </aside>

            <main class="main-content">
                {{ content }}
            </main>

            <aside class="right-sidebar">
                <h3>Links</h3>

                <a href="#">
                    GitHub
                </a>

                <a href="{{ '/about/' | relative_url }}">
                    About Me
                </a>

                <h3>Topics</h3>

                <p>Embedded Systems</p>
                <p>Retro Computing</p>
                <p>Hardware</p>
            </aside>

        </div>

        <footer class="site-footer">
            <p>
                &copy; {{ site.time | date: "%Y" }} {{ site.title }}
            </p>
        </footer>

    </div>
</body>
</html>
